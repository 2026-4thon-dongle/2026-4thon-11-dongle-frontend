# 배포 이미지(Dockerfile)의 nginx 설정. React Router 주소(/mailbox/12 등)로 바로 들어오거나 새로고침해도 index.html을 준다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 플랫폼·Docker 상태 확인용
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # 빌드 결과의 파일 이름에 해시가 붙어 있어 오래 캐시해도 된다
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 화면 주소는 모두 index.html로 돌린다. index.html은 배포가 바로 보이도록 캐시하지 않는다
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
